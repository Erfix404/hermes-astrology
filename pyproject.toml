[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "hermes-astrology"
version = "4.0.0"
description = "Deterministic multi-tradition astrology engine — Western, Vedic, Chinese BaZi"
authors = [{name = "Erfan Ashouri", email = "erfix404@github.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
keywords = ["astrology", "ephemeris", "vedic", "jyotish", "bazi", "natal-chart"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific Computing :: Astronomy",
    "Topic :: Religion :: Astrology",
]

[project.urls]
Homepage = "https://github.com/Erfix404/hermes-astrology"
Repository = "https://github.com/Erfix404/hermes-astrology"

[project.scripts]
astro = "scripts.astro_cli:main"

[tool.setuptools.packages.find]
include = ["scripts*"]
